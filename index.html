<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Norske nyheter</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --nrk: #0b5cad; --vg: #d4202c; --warn: #a16207; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #2e2a27; --nrk: #6aa8ec; --vg: #f2616b; --warn: #fbbf24; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    h1 { font-size: 1.6rem; margin: 0; }
    button { font: inherit; font-size: .9rem; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button:disabled { opacity: .5; cursor: wait; }
    #status { color: var(--muted); font-size: .85rem; margin: 0 0 16px; min-height: 1.2em; }
    #status.warn { color: var(--warn); }
    ol { list-style: none; margin: 0; padding: 0; }
    li { border-top: 1px solid var(--line); padding: 14px 0; }
    li a { color: var(--fg); text-decoration: none; font-weight: 600; }
    li a:hover { text-decoration: underline; }
    .meta { margin-top: 4px; font-size: .8rem; color: var(--muted); }
    .src { font-weight: 700; margin-right: 6px; }
    .src.NRK { color: var(--nrk); }
    .src.VG { color: var(--vg); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Siste nyheter</h1>
      <button id="refresh" type="button">Oppdater</button>
    </header>
    <p id="status">Laster…</p>
    <ol id="list"></ol>
  </main>
  <script>
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const btn = document.getElementById('refresh');
    const TZ = 'Europe/Oslo';
    const timeFmt = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit' });
    const clockFmt = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
    const fullFmt = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, dateStyle: 'short', timeStyle: 'medium' });

    // One status note per source that failed; stale fallbacks say which time they're from.
    function sourceNotes(data) {
      if (!data.sources) return data.errors || [];
      return Object.entries(data.sources)
        .filter(([, s]) => !s.ok)
        .map(([name, s]) => s.stale
          ? `${name}: oppdatering feilet – viser lagrede saker fra kl. ${clockFmt.format(new Date(s.fetchedAt))}`
          : `${name}: ikke tilgjengelig (${s.error})`);
    }

    function ago(iso) {
      const min = Math.round((Date.now() - new Date(iso)) / 60000);
      if (min < 1) return 'akkurat nå';
      if (min < 60) return `${min} min siden`;
      return timeFmt.format(new Date(iso));
    }

    async function load() {
      btn.disabled = true;
      status.classList.remove('warn');
      status.textContent = 'Laster…';
      try {
        const res = await fetch('/api/news', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        list.replaceChildren(...data.items.map((item) => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = item.link;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = item.title;
          const meta = document.createElement('div');
          meta.className = 'meta';
          const src = document.createElement('span');
          src.className = `src ${item.source}`;
          src.textContent = item.source;
          const time = document.createElement('time');
          time.dateTime = item.published;
          time.title = fullFmt.format(new Date(item.published));
          time.textContent = ago(item.published);
          meta.append(src, time);
          li.append(a, meta);
          return li;
        }));
        const notes = sourceNotes(data);
        status.classList.toggle('warn', notes.length > 0);
        status.textContent = `Hentet ${clockFmt.format(new Date(data.updated))}` +
          (notes.length ? ` · ⚠ ${notes.join(' · ')}` : '');
      } catch (err) {
        status.classList.add('warn');
        status.textContent = `Kunne ikke hente nyheter: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
